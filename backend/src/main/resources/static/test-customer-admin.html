<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <title>Test - 客户信息管理测试页</title>
  <style>
    body{font-family:Arial,Helvetica,sans-serif;margin:20px}
    input,select,button,textarea{margin:4px}
    .section{border:1px solid #ddd;padding:10px;margin-bottom:12px;border-radius:6px}
    pre{background:#f7f7f7;padding:10px;white-space:pre-wrap;max-height:500px;overflow-y:auto}
  </style>
</head>
<body>
  <h2>Test - 客户信息管理（URL 带 test）</h2>

  <div class="section">
    <button onclick="listAll()">列出所有客户</button>
    <button onclick="getStatistics()">获取统计</button>
    <button onclick="insertTestData()">插入测试数据</button>
  </div>

  <div class="section">
    <strong>按客户号查询 / 增删改</strong><br/>
    客户号: <input id="cNo" placeholder="例如 C0000001" />
    <button onclick="getCustomer()">查询</button>
    <button onclick="deleteCustomer()">删除</button>
    <br/><br/>
    <strong>新增 / 更新（JSON 字段示例）</strong><br/>
    <textarea id="customerJson" rows="6" cols="80">{"cNo":"C0000001","cName":"张三","company":"阿里巴巴集团","phone":"13800138000","address":"浙江省杭州市余杭区文一西路969号","postCode":"310000"}</textarea><br/>
    <button onclick="createCustomer()">新增</button>
    <button onclick="updateCustomer()">更新（PUT）</button>
  </div>

  <div class="section">
    <strong>按姓名模糊查询</strong><br/>
    姓名: <input id="searchName" placeholder="例如 张" />
    <button onclick="searchByName()">查询</button>
  </div>

  <div class="section">
    <strong>按电话号码查询</strong><br/>
    电话: <input id="searchPhone" placeholder="例如 138" />
    <button onclick="searchByPhone()">查询</button>
  </div>

  <div class="section">
    <strong>按公司查询</strong><br/>
    公司名称: <input id="company" placeholder="例如 阿里巴巴" />
    <button onclick="getByCompany()">精确查询</button>
    <button onclick="searchByCompany()">模糊查询</button>
  </div>

  <div class="section">
    <strong>按地址模糊查询</strong><br/>
    地址: <input id="searchAddress" placeholder="例如 北京" />
    <button onclick="searchByAddress()">查询</button>
  </div>

  <div class="section">
    <strong>多条件查询</strong><br/>
    姓名: <input id="multiName" placeholder="姓名关键字" />
    电话: <input id="multiPhone" placeholder="电话关键字" />
    公司: <input id="multiCompany" placeholder="公司关键字" />
    <button onclick="multiSearch()">多条件查询</button>
  </div>

  <div class="section">
    <strong>更新客户电话（PATCH）</strong><br/>
    客户号: <input id="phoneCNo" placeholder="例如 C0000001" />
    新电话: <input id="newPhone" placeholder="例如 13912345678" />
    <button onclick="patchPhone()">更新电话</button>
  </div>

  <div class="section">
    <strong>更新客户地址（PATCH）</strong><br/>
    客户号: <input id="addressCNo" placeholder="例如 C0000001" />
    新地址: <input id="newAddress" placeholder="新地址" style="width:300px" />
    <button onclick="patchAddress()">更新地址</button>
  </div>

  <h3>响应结果</h3>
  <pre id="output">等待操作...</pre>

  <script>
    const API_BASE = 'http://localhost:8080/api/customers';
    const OUT = document.getElementById('output');

    function show(v){ OUT.textContent = typeof v === 'string' ? v : JSON.stringify(v, null, 2); }

    async function listAll(){
      try{
        const res = await fetch(`${API_BASE}?test=true`);
        const text = await res.text();
        if(text) {
          try {
            const json = JSON.parse(text);
            show(json);
          } catch(e) {
            show(`JSON解析失败: ${e}\n原始内容: ${text}`);
          }
        } else {
          show('返回空内容');
        }
      }catch(e){ show('请求失败：'+e); }
    }

    async function getCustomer(){
      const id = document.getElementById('cNo').value.trim();
      if(!id){ show('请输入客户号'); return; }
      try{
        const res = await fetch(`${API_BASE}/${encodeURIComponent(id)}?test=true`);
        if(res.status===404){ show('未找到'); return; }
        show(await res.json());
      }catch(e){ show('请求失败：'+e); }
    }

    async function createCustomer(){
      let body;
      try{ body = JSON.parse(document.getElementById('customerJson').value); }catch(e){ show('JSON 格式错误'); return; }
      try{
        const res = await fetch(`${API_BASE}?test=true`, {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify(body)
        });
        const data = await res.json();
        show({status: res.status, body: data});
      }catch(e){ show('请求失败：'+e); }
    }

    async function updateCustomer(){
      const id = document.getElementById('cNo').value.trim();
      if(!id){ show('请输入客户号用于更新'); return; }
      let body;
      try{ body = JSON.parse(document.getElementById('customerJson').value); }catch(e){ show('JSON 格式错误'); return; }
      try{
        const res = await fetch(`${API_BASE}/${encodeURIComponent(id)}?test=true`, {
          method:'PUT',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify(body)
        });
        const data = await res.json();
        show({status: res.status, body: data});
      }catch(e){ show('请求失败：'+e); }
    }

    async function deleteCustomer(){
      const id = document.getElementById('cNo').value.trim();
      if(!id){ show('请输入客户号用于删除'); return; }
      try{
        const res = await fetch(`${API_BASE}/${encodeURIComponent(id)}?test=true`, { method:'DELETE' });
        show({status: res.status, message: res.status===204 ? '删除成功' : await res.text()});
      }catch(e){ show('请求失败：'+e); }
    }

    async function searchByName(){
      const name = document.getElementById('searchName').value.trim();
      if(!name){ show('请输入姓名'); return; }
      try{
        const res = await fetch(`${API_BASE}/search/name?cName=${encodeURIComponent(name)}&test=true`);
        show(await res.json());
      }catch(e){ show('请求失败：'+e); }
    }

    async function searchByPhone(){
      const phone = document.getElementById('searchPhone').value.trim();
      if(!phone){ show('请输入电话'); return; }
      try{
        const res = await fetch(`${API_BASE}/search/phone?phone=${encodeURIComponent(phone)}&test=true`);
        show(await res.json());
      }catch(e){ show('请求失败：'+e); }
    }

    async function getByCompany(){
      const company = document.getElementById('company').value.trim();
      if(!company){ show('请输入公司名称'); return; }
      try{
        const res = await fetch(`${API_BASE}/company/${encodeURIComponent(company)}?test=true`);
        show(await res.json());
      }catch(e){ show('请求失败：'+e); }
    }

    async function searchByCompany(){
      const company = document.getElementById('company').value.trim();
      if(!company){ show('请输入公司名称'); return; }
      try{
        const res = await fetch(`${API_BASE}/search/company?company=${encodeURIComponent(company)}&test=true`);
        show(await res.json());
      }catch(e){ show('请求失败：'+e); }
    }

    async function searchByAddress(){
      const address = document.getElementById('searchAddress').value.trim();
      if(!address){ show('请输入地址'); return; }
      try{
        const res = await fetch(`${API_BASE}/search/address?address=${encodeURIComponent(address)}&test=true`);
        show(await res.json());
      }catch(e){ show('请求失败：'+e); }
    }

    async function multiSearch(){
      const name = document.getElementById('multiName').value.trim();
      const phone = document.getElementById('multiPhone').value.trim();
      const company = document.getElementById('multiCompany').value.trim();

      const params = new URLSearchParams();
      if(name) params.append('cName', name);
      if(phone) params.append('phone', phone);
      if(company) params.append('company', company);
      params.append('test', 'true');

      try{
        const res = await fetch(`${API_BASE}/search?${params.toString()}`);
        show(await res.json());
      }catch(e){ show('请求失败：'+e); }
    }

    async function patchPhone(){
      const id = document.getElementById('phoneCNo').value.trim();
      const newPhone = document.getElementById('newPhone').value.trim();
      if(!id || !newPhone){ show('请输入客户号和新电话'); return; }
      try{
        const res = await fetch(`${API_BASE}/${encodeURIComponent(id)}/phone?test=true`, {
          method:'PATCH',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ phone: newPhone })
        });
        show({status: res.status, body: await res.json()});
      }catch(e){ show('请求失败：'+e); }
    }

    async function patchAddress(){
      const id = document.getElementById('addressCNo').value.trim();
      const newAddress = document.getElementById('newAddress').value.trim();
      if(!id || !newAddress){ show('请输入客户号和新地址'); return; }
      try{
        const res = await fetch(`${API_BASE}/${encodeURIComponent(id)}/address?test=true`, {
          method:'PATCH',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ address: newAddress })
        });
        show({status: res.status, body: await res.json()});
      }catch(e){ show('请求失败：'+e); }
    }

    async function getStatistics(){
      try{
        const res = await fetch(`${API_BASE}/statistics?test=true`);
        show(await res.json());
      }catch(e){ show('请求失败：'+e); }
    }

    async function insertTestData(){
      show('开始插入测试数据...');
      const testCustomers = [
        {cNo:"C0000001",cName:"张三",company:"阿里巴巴集团",phone:"13800138000",address:"浙江省杭州市余杭区文一西路969号",postCode:"310000"},
        {cNo:"C0000002",cName:"李四",company:"腾讯科技",phone:"13900139000",address:"广东省深圳市南山区科技园",postCode:"518000"},
        {cNo:"C0000003",cName:"王五",company:null,phone:"13700137000",address:"北京市朝阳区建国路88号",postCode:"100000"},
        {cNo:"C0000004",cName:"赵六",company:"百度",phone:"13600136000",address:"北京市海淀区上地十街10号",postCode:"100085"}
      ];

      let results = [];
      for(const customer of testCustomers){
        try{
          const res = await fetch(`${API_BASE}?test=true`, {
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body: JSON.stringify(customer)
          });
          if(res.ok){
            const data = await res.json();
            results.push({customer: customer.cNo, status: res.status, success: true, data: data});
          } else {
            const errorText = await res.text();
            try {
              const errorData = JSON.parse(errorText);
              results.push({customer: customer.cNo, status: res.status, success: false, error: errorData});
            } catch(e) {
              results.push({customer: customer.cNo, status: res.status, success: false, error: errorText});
            }
          }
        }catch(e){
          results.push({customer: customer.cNo, success: false, error: e.message});
        }
      }
      show({message: '测试数据插入完成', results: results});
    }
  </script>
</body>
</html>
