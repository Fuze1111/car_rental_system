<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <title>Test - 租赁业务管理测试页</title>
  <style>
    body{font-family:Arial,Helvetica,sans-serif;margin:20px}
    input,select,button,textarea{margin:4px}
    .section{border:1px solid #ddd;padding:10px;margin-bottom:12px;border-radius:6px}
    pre{background:#f7f7f7;padding:10px;white-space:pre-wrap}
    table{border-collapse:collapse;width:100%}
    th,td{border:1px solid #ccc;padding:6px}
  </style>
</head>
<body>
  <h2>Test - 租赁业务管理（URL 带 test）</h2>

  <div class="section">
    <button onclick="listAll()">列出所有租赁记录</button>
    <button onclick="getStatistics()">获取统计</button>
    <button onclick="insertTestData()">插入测试数据</button>
  </div>

  <div class="section">
    <strong>按发票号查询 / 增删改</strong><br/>
    发票号: <input id="invoiceNo" placeholder="例如 INV20251101001" />
    <button onclick="getRental()">查询</button>
    <button onclick="deleteRental()">删除</button>
    <br/><br/>
    <strong>新增 / 更新（JSON 字段示例）</strong><br/>
    <textarea id="rentalJson" rows="8" cols="80">{"invoiceNo":"INV20251201001","date":"2025-12-01","place":"北京市朝阳区","carId":"京A12345","cNo":"C0000001","dNo":"D0000001","roundTripDistance":100,"driveTime":2.5,"amount":1000}</textarea><br/>
    <button onclick="createRental()">新增</button>
    <button onclick="updateRental()">更新（PUT）</button>
  </div>

  <div class="section">
    <strong>按客户号查询</strong><br/>
    客户号: <input id="cNo" placeholder="例如 C0000001" />
    <button onclick="getByCustomer()">查询</button>
  </div>

  <div class="section">
    <strong>按司机号查询</strong><br/>
    司机号: <input id="dNo" placeholder="例如 D0000001" />
    <button onclick="getByDriver()">查询</button>
  </div>

  <div class="section">
    <strong>按车辆ID查询</strong><br/>
    车辆ID: <input id="carId" placeholder="例如 京A12345" />
    <button onclick="getByCar()">查询</button>
  </div>

  <div class="section">
    <strong>按地点模糊查询</strong><br/>
    地点: <input id="place" placeholder="例如 北京" />
    <button onclick="searchByPlace()">查询</button>
  </div>

  <div class="section">
    <strong>按日期范围查询</strong><br/>
    开始日期: <input id="startDate" type="date" />
    结束日期: <input id="endDate" type="date" />
    <button onclick="getByDateRange()">查询</button>
    <button onclick="calculateRevenue()">计算收入</button>
  </div>

  <div class="section">
    <strong>按金额范围查询</strong><br/>
    最小金额: <input id="minAmount" type="number" placeholder="例如 500" />
    最大金额: <input id="maxAmount" type="number" placeholder="例如 2000" />
    <button onclick="getByAmountRange()">查询</button>
  </div>

  <div class="section">
    <strong>多条件查询</strong><br/>
    客户号: <input id="searchCNo" placeholder="C0000001" />
    司机号: <input id="searchDNo" placeholder="D0000001" />
    车辆ID: <input id="searchCarId" placeholder="京A12345" /><br/>
    开始日期: <input id="searchStartDate" type="date" />
    结束日期: <input id="searchEndDate" type="date" />
    <button onclick="searchRentals()">多条件查询</button>
  </div>

  <h3>响应结果</h3>
  <pre id="output">等待操作...</pre>

  <script>
    const API_BASE = 'http://localhost:8080/api/rentals';
    const OUT = document.getElementById('output');

    function show(v){ OUT.textContent = typeof v === 'string' ? v : JSON.stringify(v, null, 2); }

    async function listAll(){
      try{
        const res = await fetch(`${API_BASE}?test=true`);
        const text = await res.text();
        if(text) {
          try {
            const json = JSON.parse(text);
            show(json);
          } catch(e) {
            show(`JSON解析失败: ${e}\n原始内容: ${text}`);
          }
        } else {
          show('返回空内容');
        }
      }catch(e){ show('请求失败：'+e); }
    }

    async function getRental(){
      const id = document.getElementById('invoiceNo').value.trim();
      if(!id){ show('请输入发票号'); return; }
      try{
        const res = await fetch(`${API_BASE}/${encodeURIComponent(id)}?test=true`);
        if(res.status===404){ show('未找到'); return; }
        show(await res.json());
      }catch(e){ show('请求失败：'+e); }
    }

    async function createRental(){
      let body;
      try{ body = JSON.parse(document.getElementById('rentalJson').value); }catch(e){ show('JSON 格式错误'); return; }
      try{
        const res = await fetch(`${API_BASE}?test=true`, {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify(body)
        });
        const data = await res.json();
        show({status: res.status, body: data});
      }catch(e){ show('请求失败：'+e); }
    }

    async function updateRental(){
      const id = document.getElementById('invoiceNo').value.trim();
      if(!id){ show('请输入发票号用于更新'); return; }
      let body;
      try{ body = JSON.parse(document.getElementById('rentalJson').value); }catch(e){ show('JSON 格式错误'); return; }
      try{
        const res = await fetch(`${API_BASE}/${encodeURIComponent(id)}?test=true`, {
          method:'PUT',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify(body)
        });
        const data = await res.json();
        show({status: res.status, body: data});
      }catch(e){ show('请求失败：'+e); }
    }

    async function deleteRental(){
      const id = document.getElementById('invoiceNo').value.trim();
      if(!id){ show('请输入发票号用于删除'); return; }
      try{
        const res = await fetch(`${API_BASE}/${encodeURIComponent(id)}?test=true`, { method:'DELETE' });
        show({status: res.status, message: res.status===204 ? '删除成功' : await res.text()});
      }catch(e){ show('请求失败：'+e); }
    }

    async function getByCustomer(){
      const cNo = document.getElementById('cNo').value.trim();
      if(!cNo){ show('请输入客户号'); return; }
      try{
        const res = await fetch(`${API_BASE}/customer/${encodeURIComponent(cNo)}?test=true`);
        show(await res.json());
      }catch(e){ show('请求失败：'+e); }
    }

    async function getByDriver(){
      const dNo = document.getElementById('dNo').value.trim();
      if(!dNo){ show('请输入司机号'); return; }
      try{
        const res = await fetch(`${API_BASE}/driver/${encodeURIComponent(dNo)}?test=true`);
        show(await res.json());
      }catch(e){ show('请求失败：'+e); }
    }

    async function getByCar(){
      const carId = document.getElementById('carId').value.trim();
      if(!carId){ show('请输入车辆ID'); return; }
      try{
        const res = await fetch(`${API_BASE}/car/${encodeURIComponent(carId)}?test=true`);
        show(await res.json());
      }catch(e){ show('请求失败：'+e); }
    }

    async function searchByPlace(){
      const place = document.getElementById('place').value.trim();
      if(!place){ show('请输入地点'); return; }
      try{
        const res = await fetch(`${API_BASE}/search/place?place=${encodeURIComponent(place)}&test=true`);
        show(await res.json());
      }catch(e){ show('请求失败：'+e); }
    }

    async function getByDateRange(){
      const start = document.getElementById('startDate').value;
      const end = document.getElementById('endDate').value;
      if(!start || !end){ show('请输入日期范围'); return; }
      try{
        const res = await fetch(`${API_BASE}/date-range?start=${start}&end=${end}&test=true`);
        show(await res.json());
      }catch(e){ show('请求失败：'+e); }
    }

    async function getByAmountRange(){
      const min = document.getElementById('minAmount').value;
      const max = document.getElementById('maxAmount').value;
      if(!min || !max){ show('请输入金额范围'); return; }
      try{
        const res = await fetch(`${API_BASE}/amount-range?min=${min}&max=${max}&test=true`);
        show(await res.json());
      }catch(e){ show('请求失败：'+e); }
    }

    async function searchRentals(){
      const cNo = document.getElementById('searchCNo').value.trim();
      const dNo = document.getElementById('searchDNo').value.trim();
      const carId = document.getElementById('searchCarId').value.trim();
      const startDate = document.getElementById('searchStartDate').value;
      const endDate = document.getElementById('searchEndDate').value;

      const params = new URLSearchParams();
      if(cNo) params.append('cNo', cNo);
      if(dNo) params.append('dNo', dNo);
      if(carId) params.append('carId', carId);
      if(startDate) params.append('startDate', startDate);
      if(endDate) params.append('endDate', endDate);
      params.append('test', 'true');

      try{
        const res = await fetch(`${API_BASE}/search?${params.toString()}`);
        show(await res.json());
      }catch(e){ show('请求失败：'+e); }
    }

    async function getStatistics(){
      try{
        const res = await fetch(`${API_BASE}/statistics?test=true`);
        show(await res.json());
      }catch(e){ show('请求失败：'+e); }
    }

    async function calculateRevenue(){
      const start = document.getElementById('startDate').value;
      const end = document.getElementById('endDate').value;
      if(!start || !end){ show('请输入日期范围'); return; }
      try{
        const res = await fetch(`${API_BASE}/revenue?start=${start}&end=${end}&test=true`);
        show(await res.json());
      }catch(e){ show('请求失败：'+e); }
    }

    async function insertTestData(){
      show('开始插入测试数据...');
      const testRentals = [
        {invoiceNo:"INV20251101001",date:"2025-11-01",place:"北京市朝阳区",carId:"京A12345",cNo:"C0000001",dNo:"D0000001",roundTripDistance:150.50,driveTime:3.50,amount:1280.50},
        {invoiceNo:"INV20251115002",date:"2025-11-15",place:"杭州市西湖区",carId:"京B67890",cNo:"C0000002",dNo:"D0000003",roundTripDistance:200.00,driveTime:4.00,amount:1800.00},
        {invoiceNo:"INV20251120003",date:"2025-11-20",place:"深圳市南山区",carId:"京C11111",cNo:"C0000003",dNo:"D0000002",roundTripDistance:80.00,driveTime:2.00,amount:1200.00}
      ];

      let results = [];
      for(const rental of testRentals){
        try{
          const res = await fetch(`${API_BASE}?test=true`, {
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body: JSON.stringify(rental)
          });
          if(res.ok){
            const data = await res.json();
            results.push({rental: rental.invoiceNo, status: res.status, success: true, data: data});
          } else {
            const errorText = await res.text();
            try {
              const errorData = JSON.parse(errorText);
              results.push({rental: rental.invoiceNo, status: res.status, success: false, error: errorData});
            } catch(e) {
              results.push({rental: rental.invoiceNo, status: res.status, success: false, error: errorText});
            }
          }
        }catch(e){
          results.push({rental: rental.invoiceNo, success: false, error: e.message});
        }
      }
      show({message: '测试数据插入完成', results: results});
    }
  </script>
</body>
</html>
